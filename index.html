<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriLog</title>
<meta name="description" content="Free calorie, macro, vitamin and mineral tracker that works offline on your phone.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">

<!-- iOS home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NutriLog">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app" role="main"></div>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="today" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/>
      <path d="M8 2.5v4M16 2.5v4M3 10h18"/>
    </svg>
    Today
  </button>
  <button class="tab" role="tab" data-tab="add" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
    </svg>
    Add food
  </button>
  <button class="tab" role="tab" data-tab="nutrients" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>
    </svg>
    Nutrients
  </button>
  <button class="tab" role="tab" data-tab="goals" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/>
      <circle cx="12" cy="12" r="0.6" fill="currentColor"/>
    </svg>
    Goals
  </button>
</nav>

<script src="js/nutrients.js"></script>
<script src="js/units.js"></script>
<script src="js/foods.js"></script>
<script src="js/store.js"></script>
<script src="js/goals.js"></script>
<script src="js/off.js"></script>
<script src="js/scanner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
